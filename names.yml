# korba (2026-10-21): KorBa, the manually annotated subcorpus 2.0 of the
# Electronic Corpus of 17th- and 18th-century Polish Texts (IJP PAN). Keys
# are the header's pubPlace role="place" value (the place of printing or,
# for manuscripts, of writing — e.g. the village of a court book); where
# the header names no town, the consumer falls back to pubPlace
# role="region", the corpus's own regional classification (Wielkopolska,
# Małopolska, Ziemie Ruskie, ...), which this section records as region
# rows. Polish exonyms of foreign towns (Lipsk, Królewiec, Ryga, Rzym)
# match the town; homonyms are settled by the header's region value and
# the document itself (named in the notes). Refs: a Wikidata item, the
# GeoNames populated place (feature class P), and the TGN inhabited
# place where Wikidata carries one that TGN confirms. Census: 98 names,
# 1,575 documents; 86 matched, 6 region, 1 alias, 3 rejected multi-place
# values. Deliberately unlisted: Ostrów (1 document — a 1628 letter whose
# text means a river island "na Ostrowiu", not an identifiable town) and
# Honiatycze (1 document — two villages of the name, near Hrubieszów and
# near Mykolaiv, both in the Ruthenian lands; nothing in the 1722 manor
# description decides between them).
