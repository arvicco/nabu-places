# corpus-gysseling (2026-10-21): the localisations of Corpus Gysseling
# (INT/IvdNT; the 13th-century Middle Dutch originals). Keys are the
# corpus's own place-table names (plaats.txt — modern Dutch forms, with
# its own (B)/(NL) disambiguators), reached through each document's first
# localisation marker; where a document carries a region code but no
# place, the consumer falls back to the region-table name (regio.txt), so
# the nine region names are keys too. 153 names, 2,226 documents: 138
# towns, villages and abbeys matched (each a Wikidata item, plus the
# GeoNames populated place and Getty TGN record where they exist,
# GeoNames feature class and distance cross-checked live 2026-10-21),
# 13 region rows (the region table, the count of Holland's chancery,
# districts and lordships), 2 two-place localisations rejected.
# Corpus spellings that differ from the modern name (Aksel, Grauw,
# Zieriksee, Zutfen, Mörs, Kuik …) are the keys as written; the note
# names the modern place.
