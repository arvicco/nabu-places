# dharma-deccan (2026-10-21): the findspots of the Sātavāhana-era
# inscriptions (Andrew Ollett's Sātavāhana Inscriptions corpus, carried in
# the DHARMA tfb-satavahana-epigraphy repository). Keys are the verbatim
# origPlace/placeName text; upstream's own place key (placeName/@key, e.g.
# pl:Valūraka for Karle, pl:Dhānyakaṭaka for Amarāvatī and Dharanikota) is
# quoted in each note — it is the corpus's own identity claim and settles
# spelling variants (Karle/Kārle share pl:Valūraka). Where the findspot is
# a rock-cut cave complex, the row cites the cave complex, not the nearby
# village; where Ollett's key is the ancient town and Pleiades holds it,
# the Pleiades record rides beside the modern identity (Barrington-grade
# points: Pleiades coordinates for Amaravati and Nevasa sit 10–25 km off
# the modern points). 29 rows over 37 names (432 of 445 documents);
# 8 one-to-four-document findspots stay unlisted — villages with no
# gazetteer record or with unresolved homonyms (Andhau, Beḷvāḍigi,
# Candankhedā, Hipparagi, Kol, Pāle, Vaḍagāvi, Vāsana).
