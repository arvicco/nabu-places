# ndl-kotenseki (2026-10-21): the publication places of the National Diet
# Library's classical-books collection (古典籍). Keys are the NDL
# bibliographic record's 出版地 list as the consumer reads it — each
# location verbatim, brackets stripped, several locations joined by "; ".
# The digitized item IS the print or manuscript, so the place is the
# artifact's own production place (the eebo-tcp imprint stance). The
# strings are the imprints' historical spellings — 京 · 洛陽 · 皇都 for
# Kyoto, 東都 · 江府 · 武江 for Edo, 浪華 · 摂陽 for Osaka, and the
# literary toponyms of Ming–Qing Chinese imprints (金陵, 錢塘, 呉郡) — so
# one matched row per place carries the refs and every other spelling is
# an alias (one hop). Edo-period and modern spellings of one city are
# separate rows only where the refs differ (江戸 also cites the Edo item;
# 東京 does not). Matched rows cite Wikidata + GeoNames (+ TGN where the
# Wikidata item carries it), every id read back live 2026-10-21; nrct is
# cited only where the NRCT historical-placename dataset holds the
# imprint's own town or village (it has no rows for the great cities —
# 京都, 江戸/東京, 大坂 — so none is forced). Province names (尾張, 勢州,
# 摂州 …) are region rows; multi-place values are rejected rows naming
# the split. 196 names, 7,562 document-place pairs; 182 rows reach 7,436; deliberately
# unlisted: Chinese literary toponyms the records do not settle (南城,
# 大原, 遂州, 天都, 長塘, 石馬, 蘭陵, 呉山), and a handful of Japanese
# village strings whose referent among homonyms the record cannot fix
# (阪本村, 川北村 (三重縣), 山田村 (三重縣), 下国分町 (宮城縣), 大隈,
# 和国) — unmatched, visibly.
