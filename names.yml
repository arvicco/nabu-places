# nabu-places names.yml — the matching DECISIONS registry.
#
# One section per consuming-catalog source slug; keys are the source's
# VERBATIM place-name strings (byte-exact). A row is a recorded decision;
# an UNLISTED name is honestly unmatched (identity-default — the lects
# doctrine). Statuses: matched (refs required) | unlocatable | region |
# ghost | rejected (note required). alias_of redirects to another verbatim
# key in the same section; certainty defaults to high.
#
# Seed wave (2026-08-08, P63-6): cdli + oracc rows generated from CIGS
# v1.7's own keys — legacy_name IS the CDLI house composite, so exact and
# ?-suffix matches are CIGS's own authority (598/598 sites carry CDLI
# provenience ids); oracc bare names matched via anc/transc names where
# UNIQUE (2 ambiguous names deliberately left unlisted). Coverage at seed:
# cdli 250,484/273,210 docs · oracc 87,706/112,198.
