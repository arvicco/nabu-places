# corpus-oudnederlands (2026-10-21): the localisations of Corpus
# Oudnederlands (INT/IvdNT v1.0; all surviving Dutch word material
# 475–1200). Keys are each work's header place (interpGrp type="place"),
# falling back to its region where the place is empty — so dialect-area
# names are keys too. 14 names, 20 works: 9 matched (runic findspot
# villages of Groningen and Friesland, and the abbeys of Egmond,
# Munsterbilzen and Werden — each a Wikidata item, plus the GeoNames
# populated place where one exists, cross-checked live 2026-10-21),
# 4 region rows; "Nederberg" (the Nederbergse doopbelofte, 811–812)
# stays unlisted — no identification found.
corpus-oudnederlands:
  Werden:
    refs:
    - wikidata:Q688373
    status: matched
    note: >-
      Werden on the Ruhr (Essen-Werden), read as its Benedictine abbey —
      the corpus localises the three Mittelfränkische Reimbibel
      witnesses to Werden without qualification, and in 1200 the place
      is the abbey and its dependent settlement; the abbey item is the
      medieval identity
  Westeremden:
    refs:
    - geonames:2744753
    - wikidata:Q2584769
    status: matched
    note: >-
      Westeremden (Eemsdelta, Groningen), findspot of the runic
      yew-stick and weaving-sword (terp finds)
