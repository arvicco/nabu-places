# coptic-scriptorium (2026-10-21): the manuscripts' provenance places —
# the TEI header's origPlace where given, else its placeName (the codex's
# home monastery or findspot, after the PAThs atlas attributions), never
# the places a text mentions. Keys verbatim, typos included ("St.
# Macariuus" is the header's own spelling). All 16 names (309 documents)
# decided. The two monasteries no gazetteer holds — St Mercurius at Edfu
# (the MERC. codices) and St Michael near al-Hamuli (the MICH. codices) —
# are aliased at low certainty onto the nearest gazetteer identity the
# header itself pairs them with (Edfu; Hamuli), each saying so.
